# /etc/nginx/sites-available/heineart.conf
# Reverse proxy for the heineart Docker container (listening on 127.0.0.1:8090).
# Get certificates with:  sudo certbot --nginx -d heineart.ca -d www.heineart.ca
# (certbot will fill in the ssl_certificate lines below for you).

server {
    listen 80;
    listen [::]:80;
    server_name heineart.ca www.heineart.ca;
    return 301 https://heineart.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.heineart.ca;
    ssl_certificate     /etc/letsencrypt/live/heineart.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heineart.ca/privkey.pem;
    return 301 https://heineart.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name heineart.ca;
    ssl_certificate     /etc/letsencrypt/live/heineart.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heineart.ca/privkey.pem;

    # Allow large photo uploads from the admin page.
    client_max_body_size 100M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # The admin page uses a long-lived realtime connection.
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 1h;
    }
}
