# nginx config for the heineart Docker container (listening on 127.0.0.1:8090).
#
# This file stays in the repo; nginx reads it through a symlink, so a
# `git pull` updates it. See "nginx + HTTPS" in the README for setup.
# Certificates come from `certbot certonly`, which never edits this file.
#
# To serve another domain (e.g. heineart.ca) from the same site, add it to the
# server_name lines and get a certificate that covers it.

server {
    listen 80;
    listen [::]:80;
    server_name pottedpainter.ca www.pottedpainter.ca;
    return 301 https://pottedpainter.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pottedpainter.ca;
    ssl_certificate     /etc/letsencrypt/live/pottedpainter.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pottedpainter.ca/privkey.pem;
    return 301 https://pottedpainter.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pottedpainter.ca;
    ssl_certificate     /etc/letsencrypt/live/pottedpainter.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pottedpainter.ca/privkey.pem;

    # Allow large photo uploads from the admin page.
    client_max_body_size 100M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # The admin page uses a long-lived realtime connection.
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
