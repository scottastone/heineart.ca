# /etc/nginx/sites-available/pottedpainter.conf
#
# Reverse proxy for the heineart Docker container (listening on 127.0.0.1:8090).
# This starts as plain HTTP on purpose. Then run:
#   sudo certbot --nginx -d pottedpainter.ca -d www.pottedpainter.ca --redirect
# and certbot adds the HTTPS settings and the http -> https redirect to this file.
#
# To serve another domain (e.g. heineart.ca) from the same site, add it to
# server_name and include it in the certbot command.

server {
    listen 80;
    listen [::]:80;
    server_name pottedpainter.ca www.pottedpainter.ca;

    # Allow large photo uploads from the admin page.
    client_max_body_size 100M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # The admin page uses a long-lived realtime connection.
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
